[project]
name = "harbor-autoresearch"
dynamic = ["version"]
description = "Timed AutoResearchExam runs for Harbor"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Bespoke Labs" },
]
keywords = ["autoresearch", "evaluation", "harbor"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "harbor>=0.22.0",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
modal = ["harbor[modal]>=0.22.0"]
tinker = ["harbor[tinker]>=0.22.0"]
dev = [
    "build>=1.2,<2",
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.2,<2",
    "ruff>=0.15,<0.16",
    "twine>=6,<7",
    "ty>=0.0.49,<0.1",
]

[project.urls]
Homepage = "https://github.com/bespokelabsai/AutoResearchExam-Terminus"
Repository = "https://github.com/bespokelabsai/AutoResearchExam-Terminus.git"
Issues = "https://github.com/bespokelabsai/AutoResearchExam-Terminus/issues"

[project.entry-points."harbor.plugins"]
autoresearch-exam = "harbor_autoresearch.plugin:TimedWindowPlugin"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/harbor_autoresearch/__init__.py"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = [
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/scripts",
    "/src",
    "/tests",
]

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
packages = ["src/harbor_autoresearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-q", "--strict-markers", "--strict-config"]
markers = ["docker: requires a working local Docker daemon"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.src]
include = ["scripts", "src"]
