name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the package and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Check types
        run: ty check

      - name: Run unit tests
        run: timeout 300s pytest -m "not docker"

      - name: Build distributions
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Check the wheel in a clean environment
        run: |
          python -m venv /tmp/autoresearch-wheel-check
          /tmp/autoresearch-wheel-check/bin/pip install --no-deps dist/*.whl
          /tmp/autoresearch-wheel-check/bin/python -c "import harbor_autoresearch"
